[platformio]
default_envs = main_controller
extra_configs = platformio.local.ini

[bluesquid_wifi]
cerbo_ssid =
cerbo_password =
hotspot_ssid = BlueSquid
hotspot_password = 1234567890

[env:main_controller]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter =
    +<main.cpp>
    -<touchscreen/>
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ; Defaults only: saved Cerbo settings take precedence. Fill in your Cerbo hotspot credentials.
    '-DBLUESQUID_CERBO_WIFI_SSID="${bluesquid_wifi.cerbo_ssid}"'
    '-DBLUESQUID_CERBO_WIFI_PASSWORD="${bluesquid_wifi.cerbo_password}"'
    -Iinclude
    ; Keep framework/NimBLE discovery chatter below info while retaining
    ; BlueSquid's own LOG_LEVEL=3 commissioning messages.
    -DCORE_DEBUG_LEVEL=2
    -DLOG_LEVEL=3
    -DBLUESQUID_LOG_INFO_ENABLED=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=6
    -DCONFIG_BT_NIMBLE_MAX_BONDS=6
    -DARDUINO_USB_MODE=1
    ; The configured 1A86:55D3 USB serial bridge connects to UART0.
    ; Route Serial logs there, not to the separate native USB CDC interface.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBLUESQUID_SIMULATED_HARDWARE=0 ;1
    -DBLUESQUID_SIMULATED_BATTERY=0
    -DBLUESQUID_BATTERY_CAPACITY_AH=200
    -DBLUESQUID_CAN_TX_PIN=37
    -DBLUESQUID_CAN_RX_PIN=38
    -DBLUESQUID_SIMULATED_SENSORS=0
    -DBLUESQUID_CLIMATE_I2C_SDA_PIN=10
    -DBLUESQUID_CLIMATE_I2C_SCL_PIN=11
    -DBLUESQUID_GY61_X_PIN=4
    -DBLUESQUID_GY61_Y_PIN=5
    -DBLUESQUID_GY61_Z_PIN=6
    ; RGBW power stages are external SP630E BLE controllers. Keeping these
    ; GPIOs disabled also avoids exhausting the ESP32-S3's eight LEDC channels.
    -DBLUESQUID_RGBW_RED_PIN=-1
    -DBLUESQUID_RGBW_GREEN_PIN=-1
    -DBLUESQUID_RGBW_BLUE_PIN=-1
    -DBLUESQUID_RGBW_WHITE_PIN=-1
    -DBLUESQUID_BED_RGBW_RED_PIN=-1
    -DBLUESQUID_BED_RGBW_GREEN_PIN=-1
    -DBLUESQUID_BED_RGBW_BLUE_PIN=-1
    -DBLUESQUID_BED_RGBW_WHITE_PIN=-1
    -DBLUESQUID_ALL_LIGHTS_SWITCH_PIN=35
    -DBLUESQUID_ACCESSORY3_PIN=36
    -DBLUESQUID_ACCESSORY4_PIN=39
    -DBLUESQUID_ACCESSORY3_ACTIVE_HIGH=1
lib_deps =
    adafruit/Adafruit HTU21DF Library@^1.1.2
    h2zero/NimBLE-Arduino@^1.4.3

[env:touchscreen_controller]
; Espressif's supported Waveshare display driver requires Arduino core 3.1.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_src_filter =
    -<main.cpp>
    +<touchscreen/>
build_flags =
    ; Defaults only: saved System hotspot settings take precedence.
    '-DBLUESQUID_HOTSPOT_SSID="${bluesquid_wifi.hotspot_ssid}"'
    '-DBLUESQUID_HOTSPOT_PASSWORD="${bluesquid_wifi.hotspot_password}"'
    -Iinclude
    -Isrc/touchscreen
    ; The onboard SD card uses CH422G EXIO4 for chip-select. Arduino's SD
    ; library receives -1 as its unused GPIO CS placeholder, so core logging
    ; would otherwise print an Invalid IO 255 line for every filesystem access.
    ; BlueSquid emits its own actionable SD diagnostics from main.cpp.
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_7
    -DBLUESQUID_TOUCHSCREEN_FIRMWARE=1
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v9.5.0
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^1.4.3
check_tool = cppcheck
check_flags =
    cppcheck: --enable=warning,style,performance,portability
